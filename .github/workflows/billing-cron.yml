# Agendamento real das cobranças Faith Brothers (GitHub Actions).
#
# Secrets do repositório:
#   SUPABASE_FUNCTIONS_BASE_URL  → https://wojqjxtaqjasnfhbotxi.supabase.co/functions/v1
#   BILLING_CRON_SECRET          → mesmo valor do secret Supabase
#
# GitHub Actions interpreta `cron:` em UTC (não usa TZ para agendar).
# 0 11 12 * * = 11:00 UTC do dia 12 = 08:00 America/Sao_Paulo (sem horário de verão).
# 0 11 19 * * = 11:00 UTC do dia 19 = 08:00 America/Sao_Paulo.
# TZ=America/Sao_Paulo abaixo só confere o dia civil após o job já ter disparado.
#
# - Dia 12 08:00 BRT → generate-monthly-billings (boleto + WhatsApp)
# - Dia 19 08:00 BRT → send-billing-whatsapp scope=overdue_reminder
#   (a regra exige data ESTRITAMENTE após o dia 18 do mês de vencimento;
#    no dia 18 o job retornaria overdue_reminder_too_early para todos)
# - workflow_dispatch: auth_check nao chama Edge Function (sem cobranca).
#   generate e overdue exigem autorizacao explicita — criam cobranca/WhatsApp reais.

name: Billing cron

on:
  schedule:
    - cron: "0 11 12 * *"
    - cron: "0 11 19 * *"
  workflow_dispatch:
    inputs:
      job:
        description: "generate | overdue | auth_check"
        required: true
        default: "auth_check"
        type: choice
        options:
          - auth_check
          - generate
          - overdue

jobs:
  billing:
    runs-on: ubuntu-latest
    steps:
      - name: Call Edge Function
        env:
          BASE_URL: ${{ secrets.SUPABASE_FUNCTIONS_BASE_URL }}
          CRON_SECRET: ${{ secrets.BILLING_CRON_SECRET }}
          DISPATCH_JOB: ${{ github.event_name == 'workflow_dispatch' && inputs.job || '' }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Configure secrets SUPABASE_FUNCTIONS_BASE_URL e BILLING_CRON_SECRET"
            exit 1
          fi
          if echo "${BASE_URL}" | grep -q "apbksfaztfkxshxffpik"; then
            echo "Recusando: BASE_URL aponta ao staging"
            exit 1
          fi
          if ! echo "${BASE_URL}" | grep -q "wojqjxtaqjasnfhbotxi"; then
            echo "Recusando: BASE_URL nao aponta a Production"
            exit 1
          fi

          DAY=$(TZ=America/Sao_Paulo date +%d)
          JOB="${DISPATCH_JOB}"
          if [ -z "${JOB}" ]; then
            if [ "${DAY}" = "12" ]; then
              JOB="generate"
            elif [ "${DAY}" = "19" ]; then
              JOB="overdue"
            else
              echo "Agenda fora do dia 12/19 (hoje BR=${DAY}). Nada a fazer."
              exit 0
            fi
          fi

          echo "Job=${JOB} dayBR=${DAY}"
          if [ "${JOB}" = "auth_check" ]; then
            echo "auth_check: CRON_SECRET presente; BASE_URL Production. Nenhuma Edge Function chamada."
            echo "auth_check: Nao gera cobranca e nao envia WhatsApp."
            exit 0
          elif [ "${JOB}" = "generate" ]; then
            curl -fsS -X POST "${BASE_URL%/}/generate-monthly-billings" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d '{}'
          else
            curl -fsS -X POST "${BASE_URL%/}/send-billing-whatsapp" \
              -H "Content-Type: application/json" \
              -H "x-cron-secret: ${CRON_SECRET}" \
              -d '{"scope":"overdue_reminder"}'
          fi
