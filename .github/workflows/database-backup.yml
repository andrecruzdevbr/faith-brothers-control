# Backup lógico criptografado do PostgreSQL Production (Faith Brothers).
#
# Não usa GitHub Artifacts nem o repositório como destino.
# Não imprime senhas. Não altera tabelas. Não faz restore.
#
# Destino padrão: Google Drive (escopo drive.file, pasta FaithBrothers_Backups).
# Destino legado S3: definir secret BACKUP_DEST=s3 e os BACKUP_S3_*.
#
# Dump: somente schema public (parcial; não inclui Auth).
# Agenda YAML existe, mas o job só corre em workflow_dispatch até o
# cron ser autorizado. Manter disabled_manually quando não houver teste.
#
# Secrets obrigatórios (Drive):
#   BACKUP_DB_PASSWORD
#   BACKUP_AGE_RECIPIENT          (chave pública age1...; a privada NÃO vai aqui)
#   BACKUP_DRIVE_TOKEN            (JSON OAuth rclone; nunca no Git)
#
# Secrets obrigatórios se BACKUP_DEST=s3:
#   BACKUP_S3_ENDPOINT
#   BACKUP_S3_BUCKET
#   BACKUP_S3_ACCESS_KEY_ID
#   BACKUP_S3_SECRET_ACCESS_KEY
#
# Secrets opcionais:
#   BACKUP_DEST                   default drive
#   BACKUP_DRIVE_FOLDER           default FaithBrothers_Backups (fixo no script)
#   BACKUP_DRIVE_CLIENT_ID / SECRET
#   BACKUP_DB_HOST / PORT / USER
#   BACKUP_S3_REGION / PROVIDER
#   BACKUP_RETENTION_DAYS         default 14
#   BACKUP_OBJECT_PREFIX          default faith-brothers-prod
#
# A chave privada age fica OFFLINE / gerenciador de senhas, nunca no Drive.

name: Database encrypted backup

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: database-encrypted-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install age and rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq age rclone

      - name: Encrypted Production dump
        env:
          BACKUP_DEST: ${{ secrets.BACKUP_DEST }}
          BACKUP_DB_PASSWORD: ${{ secrets.BACKUP_DB_PASSWORD }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          BACKUP_DRIVE_TOKEN: ${{ secrets.BACKUP_DRIVE_TOKEN }}
          BACKUP_DRIVE_FOLDER: ${{ secrets.BACKUP_DRIVE_FOLDER }}
          BACKUP_DRIVE_CLIENT_ID: ${{ secrets.BACKUP_DRIVE_CLIENT_ID }}
          BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.BACKUP_DRIVE_CLIENT_SECRET }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
          BACKUP_DB_HOST: ${{ secrets.BACKUP_DB_HOST }}
          BACKUP_DB_PORT: ${{ secrets.BACKUP_DB_PORT }}
          BACKUP_DB_USER: ${{ secrets.BACKUP_DB_USER }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_PROVIDER: ${{ secrets.BACKUP_S3_PROVIDER }}
          BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS }}
          BACKUP_OBJECT_PREFIX: ${{ secrets.BACKUP_OBJECT_PREFIX }}
        run: |
          set -euo pipefail
          bash scripts/backup-production-encrypted.sh
